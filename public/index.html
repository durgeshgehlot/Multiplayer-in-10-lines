<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Quiz - Spatial UI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            overflow-x: hidden;
        }

        .remote-cursor {
            position: absolute;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.05s linear;
        }

        .glass-card {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        @keyframes spin-slow {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .animate-spin-slow {
            animation: spin-slow 8s linear infinite;
        }
    </style>
</head>

<body class="bg-[#0b0f17] text-white min-h-screen flex flex-col items-center justify-center p-4 relative">

    <!-- Top Ambient Glowing Orbs -->
    <div
        class="absolute top-10 left-1/2 -translate-x-1/2 w-96 h-60 bg-gradient-to-r from-blue-600/30 via-cyan-500/20 to-purple-600/30 blur-3xl rounded-full pointer-events-none">
    </div>

    <!-- Main Profile / Quiz Card with 3D Tilt Effect -->
    <div id="tiltCard"
        class="glass-card w-full max-w-lg rounded-3xl p-6 sm:p-8 shadow-2xl relative z-10 flex flex-col gap-6">

        <!-- Header Status Bar -->
        <div class="flex justify-between items-center">
            <div
                class="flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[11px] px-3 py-1 rounded-full font-bold shadow-lg shadow-emerald-500/10">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Open for Collab
            </div>
            <div id="connectionStatus"
                class="text-xs font-mono text-slate-400 bg-slate-800/80 px-3 py-1 rounded-full border border-slate-700">
                CONNECTING...
            </div>
        </div>

        <!-- User Profile Avatar with Rotating Gradient Ring -->
        <div class="flex flex-col items-center text-center gap-3">
            <div class="relative w-24 h-24 flex items-center justify-center">
                <div
                    class="absolute inset-0 rounded-full bg-gradient-to-tr from-cyan-500 via-purple-500 to-pink-500 animate-spin-slow p-1 opacity-80">
                    <div class="w-full h-full bg-[#0b0f17] rounded-full"></div>
                </div>
                <div
                    class="relative z-10 w-20 h-20 bg-slate-900 rounded-full flex flex-col items-center justify-center shadow-inner">
                    <span class="text-xs font-bold text-cyan-400 tracking-wider">ROOM</span>
                    <span id="roomIdDisplay" class="text-[11px] font-mono text-slate-300">-----</span>
                </div>
            </div>

            <div>
                <h1 id="questionTitle"
                    class="text-xl sm:text-2xl font-black bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                    Loading Poll...
                </h1>
                <p class="text-slate-400 text-xs mt-1">Spatial UI & Real-Time Sync System</p>
            </div>
        </div>

        <!-- Config Controls -->
        <div class="flex flex-col sm:flex-row gap-2">
            <input type="text" id="userNameInput" value="Player" onkeydown="if(event.key==='Enter') updateName()"
                class="bg-slate-900/90 border border-slate-700/80 focus:border-cyan-400 text-white text-xs px-3 py-2 rounded-xl outline-none flex-1">
            <button id="updateNameBtn" onclick="updateName()"
                class="bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 px-4 py-2 rounded-xl border border-slate-700 font-semibold transition">
                Update Name
            </button>
            <button id="shareLinkBtn" onclick="copyRoomLink()"
                class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs px-4 py-2 rounded-xl transition shadow-lg shadow-cyan-500/20">
                Share Link
            </button>
            <button id="hostPasswordControls" onclick="openPasswordSettings()" class="hidden bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 px-4 py-2 rounded-xl border border-slate-700 font-semibold transition">Set password</button>
        </div>
        <div id="passwordSettings" class="hidden rounded-xl border border-slate-700 bg-slate-900/90 p-4">
            <label for="roomPasswordInput" class="block text-sm font-semibold mb-2">Room password</label>
            <div class="flex flex-wrap gap-2">
                <input id="roomPasswordInput" type="password" maxlength="128" placeholder="Create a password" onkeydown="if(event.key==='Enter'){event.preventDefault();saveRoomPassword();}"
                    class="bg-slate-950 border border-slate-700 focus:border-cyan-400 text-white text-sm px-3 py-2 rounded-lg outline-none flex-1 min-w-40">
                <button id="toggleRoomPasswordBtn" type="button" onclick="toggleRoomPasswordVisibility()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-2 rounded-lg border border-slate-700">Show</button>
                <button onclick="saveRoomPassword()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs px-4 py-2 rounded-lg font-bold">Save</button>
                <button onclick="removeRoomPassword()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-4 py-2 rounded-lg border border-slate-700">Remove</button>
            </div>
            <p id="roomPasswordStatus" class="text-xs text-slate-400 mt-2"></p>
        </div>
        <div id="guestNamePrompt" class="hidden rounded-xl border border-cyan-500/30 bg-cyan-500/10 p-4">
            <label for="joinNameInput" class="block text-sm font-semibold mb-2">Your player name</label>
            <input id="joinNameInput" type="text" maxlength="50" placeholder="Enter your player name" onkeydown="handleNameEnter(event)" class="bg-slate-900 border border-slate-700 text-white text-sm px-3 py-2 rounded-lg outline-none w-full">
            <p id="nameError" class="text-rose-300 text-xs mt-2"></p>
            <button id="joinWithoutPasswordBtn" onclick="submitGuestJoin()" class="hidden bg-cyan-500 text-slate-950 font-bold text-sm px-4 py-2 rounded-lg mt-3">Join room</button>
        </div>
        <div id="passwordPrompt" class="hidden rounded-xl border border-rose-500/30 bg-rose-500/10 p-4">
            <label for="joinPasswordInput" class="block text-sm font-semibold mb-2">Host password required</label>
            <div class="flex flex-col gap-2">
                <input id="joinPasswordInput" type="password" placeholder="Enter room password" onkeydown="if(event.key==='Enter') submitRoomPassword()" class="bg-slate-900 border border-slate-700 text-white text-sm px-3 py-2 rounded-lg outline-none flex-1">
                <button id="joinWithPasswordBtn" onclick="submitRoomPassword()" class="bg-cyan-500 text-slate-950 font-bold text-sm px-4 py-2 rounded-lg">Continue</button>
            </div>
            <p id="passwordError" class="text-rose-300 text-xs mt-2"></p>
        </div>

        <!-- Host View: Clickable collapsible participants list -->
        <div id="hostParticipants" style="display: none;">
            <div onclick="toggleParticipants()"
                class="text-[11px] font-mono text-slate-400 uppercase tracking-widest mb-2 cursor-pointer select-none flex items-center gap-2 hover:text-slate-200 transition-colors">
                <span id="participantChevron" class="text-[10px] transition-transform duration-300"
                    style="display:inline-block;">▶</span>
                ACTIVE PARTICIPANTS (<span id="userCount" class="text-cyan-400">0</span>)
            </div>
            <div id="usersList" class="flex flex-col gap-2 overflow-hidden transition-all duration-300"
                style="max-height: 0; opacity: 0;"></div>
        </div>

        <!-- Guest View: Only participant count -->
        <div id="guestParticipants" style="display: none;">
            <div class="text-[11px] font-mono text-slate-400 uppercase tracking-widest mb-2 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="guestUserCount" class="text-cyan-400 text-sm font-bold">0</span> PARTICIPANTS LIVE
            </div>
        </div>

        <!-- Poll / Quiz Options List -->
        <div id="optionsContainer" class="flex flex-col gap-3"></div>

        <!-- Bottom Stats Box -->
        <div class="grid grid-cols-3 gap-2 pt-4 border-t border-slate-800/80 text-center">
            <div>
                <div class="text-base font-bold text-white" id="totalVotesDisplay">0</div>
                <div class="text-[10px] text-slate-400 uppercase tracking-wider">TOTAL VOTES</div>
            </div>
            <div>
                <div class="text-base font-bold text-cyan-400">99.4%</div>
                <div class="text-[10px] text-slate-400 uppercase tracking-wider">RELIABILITY</div>
            </div>
            <div>
                <div class="text-base font-bold text-emerald-400">LOW LATENCY</div>
                <div class="text-[10px] text-slate-400 uppercase tracking-wider">SOCKET.IO</div>
            </div>
        </div>
    </div>

    <!-- Cursors Layer -->
    <div id="cursorsContainer"></div>

    <!-- Multiplayer Library -->
    <script src="/multiplayer.js"></script>
    <script>
        let mp = null;
        let activeRoomId = null;
        let joiningOptions = null;
        let roomHasPassword = false;
        let guestPasswordRequired = false;
        const cursorsMap = new Map();

        // Multiplayer cursor broadcast on mouse move
        window.addEventListener('mousemove', (e) => {
            if (mp) {
                mp.updateCursor(e.clientX, e.clientY);
            }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            const serverUrl = window.location.origin;
            mp = Multiplayer.connect(serverUrl);

            const urlParams = new URLSearchParams(location.search);
            let roomId = urlParams.get('id');
            let isHost = !roomId;
            const hostRoomStorageKey = `mp_host_room_${serverUrl}`;
            if (roomId) {
                try {
                    isHost = sessionStorage.getItem(hostRoomStorageKey) === roomId;
                } catch (e) {
                    // Continue as a guest if browser storage is unavailable.
                }
            }
            if (!roomId) {
                roomId = 'room-' + Math.random().toString(36).substring(2, 9);
                urlParams.set('id', roomId);
                history.replaceState({}, '', '?' + urlParams.toString());
                try {
                    sessionStorage.setItem(hostRoomStorageKey, roomId);
                } catch (e) {
                    // Host controls remain available for this page load.
                }
            }
            document.getElementById('roomIdDisplay').textContent = roomId;
            activeRoomId = roomId;

            // Host ko participants list dikhao, guest ko sirf count
            if (isHost) {
                document.getElementById('hostParticipants').style.display = 'block';
                document.getElementById('hostPasswordControls').classList.remove('hidden');
            } else {
                document.getElementById('shareLinkBtn').style.display = 'none';
                document.getElementById('userNameInput').style.display = 'none';
                document.getElementById('updateNameBtn').style.display = 'none';
                document.getElementById('guestParticipants').style.display = 'block';
            }

            const randomName = "Player " + Math.floor(Math.random() * 1000);
            document.getElementById('userNameInput').value = randomName;
            document.getElementById('joinNameInput').value = randomName;

            joiningOptions = { name: randomName };
            if (isHost) {
                try {
                    const savedPassword = sessionStorage.getItem(`mp_host_password_${roomId}`);
                    if (savedPassword) joiningOptions.password = savedPassword;
                } catch (e) {
                    // The host can still join passwordless rooms if storage is unavailable.
                }
            }
            try {
                const requiresPassword = !isHost && await Multiplayer.checkRoomPassword(serverUrl, roomId);
                if (requiresPassword) {
                    showPasswordPrompt(true);
                } else if (!isHost) {
                    showPasswordPrompt(false);
                } else {
                    await mp.join(roomId, joiningOptions);
                    await mp.initState({
                        poll: {
                            question: "Which technology stack fits best?",
                            options: ["#NodeJS & Express", "#SocketIO Realtime", "#Tailwind CSS", "#React / NextJS"],
                            votes: { 0: 0, 1: 0, 2: 0, 3: 0 },
                            userVotes: {}
                        }
                    });
                }
            } catch (err) {
                if (!isHost && err.message === 'WRONG_PASSWORD') {
                    showPasswordPrompt(true);
                    document.getElementById('joinPasswordInput').focus();
                } else {
                    console.error("Error joining:", err);
                }
            }

            mp.onStatus(status => {
                const badge = document.getElementById('connectionStatus');
                if (status === 'connected') {
                    badge.textContent = "CONNECTED";
                    badge.className = "text-xs font-mono text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/30";
                } else {
                    badge.textContent = status.toUpperCase();
                    badge.className = "text-xs font-mono text-rose-400 bg-rose-500/10 px-3 py-1 rounded-full border border-rose-500/30";
                }
            });

            mp.onUsers(users => {
                document.getElementById('userCount').textContent = users.length;
                document.getElementById('guestUserCount').textContent = users.length;
                const container = document.getElementById('usersList');
                container.innerHTML = users.map(u => `
                    <div class="bg-slate-900/80 border border-slate-700/70 text-slate-300 text-xs px-3 py-2 rounded-xl flex items-center gap-2 font-medium w-full">
                        <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color: ${u.color || '#38bdf8'}"></span>
                        <span class="truncate">${u.name} ${u.sessionId === mp.getSessionId() ? '(You)' : ''}</span>
                    </div>
                `).join('');
                // Agar participants panel open hai to max-height update karo
                if (participantsOpen) {
                    container.style.maxHeight = container.scrollHeight + 'px';
                }
            });

            mp.onState(state => {
                if (!state || !state.poll || !Array.isArray(state.poll.options)) return;
                document.getElementById('questionTitle').textContent = state.poll.question;
                const optContainer = document.getElementById('optionsContainer');
                optContainer.innerHTML = '';

                let totalVotes = 0;
                Object.values(state.poll.votes || {}).forEach(v => totalVotes += v);
                document.getElementById('totalVotesDisplay').textContent = totalVotes;

                state.poll.options.forEach((opt, index) => {
                    const votesCount = state.poll.votes ? (state.poll.votes[index] || 0) : 0;
                    const isSelected = state.poll.userVotes && state.poll.userVotes[mp.getSessionId()] === index;

                    const btn = document.createElement('button');
                    btn.className = `w-full text-left p-3.5 rounded-2xl border transition-all flex justify-between items-center group relative overflow-hidden ${isSelected
                        ? 'bg-cyan-500/10 border-cyan-400 text-white shadow-lg shadow-cyan-500/10'
                        : 'bg-slate-900/60 border-slate-800 hover:border-slate-700 text-slate-300 hover:bg-slate-900'
                        }`;

                    const optionLabel = document.createElement('span');
                    optionLabel.className = 'font-medium text-xs sm:text-sm z-10';
                    optionLabel.textContent = String(opt);
                    const voteBadge = document.createElement('span');
                    voteBadge.className = 'text-xs font-bold px-2.5 py-1 rounded-lg bg-slate-800/90 text-cyan-400 border border-slate-700 z-10';
                    voteBadge.textContent = `${votesCount} votes`;
                    btn.append(optionLabel, voteBadge);

                    btn.onclick = () => {
                        const currentPoll = JSON.parse(JSON.stringify(state.poll));
                        if (!currentPoll.votes) currentPoll.votes = {};
                        if (!currentPoll.userVotes) currentPoll.userVotes = {};

                        const oldVote = currentPoll.userVotes[mp.getSessionId()];

                        // Agar same option already selected hai to kuch mat karo
                        if (oldVote === index) return;

                        // Purana vote remove karo agar pehle kisi aur option pe vote kiya tha
                        if (oldVote !== undefined) {
                            currentPoll.votes[oldVote] = Math.max(0, (currentPoll.votes[oldVote] || 1) - 1);
                        }

                        // Naya vote add karo
                        currentPoll.votes[index] = (currentPoll.votes[index] || 0) + 1;
                        currentPoll.userVotes[mp.getSessionId()] = index;

                        mp.setState({ poll: currentPoll });
                    };
                    optContainer.appendChild(btn);
                });
            });

            mp.onCursors(cursors => {
                const container = document.getElementById('cursorsContainer');
                const activeIds = new Set(Object.keys(cursors));

                for (let [id, el] of cursorsMap.entries()) {
                    if (!activeIds.has(id)) {
                        el.remove();
                        cursorsMap.delete(id);
                    }
                }

                Object.values(cursors).forEach(c => {
                    let el = cursorsMap.get(c.sessionId);
                    if (!el) {
                        el = document.createElement('div');
                        el.className = 'remote-cursor flex items-center gap-1.5';
                        el.innerHTML = `
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="${c.color || '#38bdf8'}" stroke="white" stroke-width="1.5" class="drop-shadow-lg">
                                <polygon points="5 3 19 12 12 14 9 21 5 3"></polygon>
                            </svg>
                            <span class="bg-slate-900/95 text-cyan-300 text-[11px] font-bold px-2.5 py-1 rounded-lg shadow-xl border border-slate-700/80 backdrop-blur-md whitespace-nowrap -translate-y-2 animate-bounce">${c.name || 'User'}</span>
                        `;
                        container.appendChild(el);
                        cursorsMap.set(c.sessionId, el);
                    }
                    el.style.transform = `translate(${c.x}px, ${c.y}px)`;
                });
            });
        });

        let participantsOpen = false;
        function toggleParticipants() {
            participantsOpen = !participantsOpen;
            const list = document.getElementById('usersList');
            const chevron = document.getElementById('participantChevron');
            if (participantsOpen) {
                list.style.maxHeight = list.scrollHeight + 'px';
                list.style.opacity = '1';
                chevron.style.transform = 'rotate(90deg)';
            } else {
                list.style.maxHeight = '0';
                list.style.opacity = '0';
                chevron.style.transform = 'rotate(0deg)';
            }
        }

        async function copyRoomLink() {
            try {
                if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('Clipboard unavailable');
                await navigator.clipboard.writeText(window.location.href);
                alert("Room link copied to clipboard!");
            } catch (err) {
                window.prompt('Copy this room link:', window.location.href);
            }
        }

        function openPasswordSettings() {
            const panel = document.getElementById('passwordSettings');
            panel.classList.toggle('hidden');
            if (panel.classList.contains('hidden')) {
                document.getElementById('roomPasswordInput').type = 'password';
                document.getElementById('toggleRoomPasswordBtn').textContent = 'Show';
                return;
            }
            const input = document.getElementById('roomPasswordInput');
            document.getElementById('roomPasswordStatus').textContent = 'Loading room password…';
            mp.emitRaw('room:getPassword', { roomId: activeRoomId, sessionId: mp.getSessionId() }, (result) => {
                if (!result || !result.success) {
                    document.getElementById('roomPasswordStatus').textContent = result?.error || 'Could not load room password.';
                    return;
                }
                roomHasPassword = result.hasPassword;
                input.value = result.password || '';
                input.placeholder = roomHasPassword ? 'Enter a new password' : 'Create a password';
                document.getElementById('roomPasswordStatus').textContent = roomHasPassword ? 'A password is currently set.' : 'No password is currently set.';
                input.focus();
            });
        }

        function saveRoomPassword() {
            const password = document.getElementById('roomPasswordInput').value.trim();
            if (!password) {
                document.getElementById('roomPasswordStatus').textContent = 'Enter a password, or choose Remove to clear it.';
                return;
            }
            updateRoomPassword(password);
        }

        function toggleRoomPasswordVisibility() {
            const input = document.getElementById('roomPasswordInput');
            const button = document.getElementById('toggleRoomPasswordBtn');
            const showPassword = input.type === 'password';
            input.type = showPassword ? 'text' : 'password';
            button.textContent = showPassword ? 'Hide' : 'Show';
        }

        function removeRoomPassword() {
            updateRoomPassword('');
        }

        function updateRoomPassword(password) {
            mp.emitRaw('room:setPassword', { roomId: activeRoomId, sessionId: mp.getSessionId(), password }, (result) => {
                if (!result || !result.success) {
                    document.getElementById('roomPasswordStatus').textContent = result?.error || 'Could not update password.';
                    return;
                }
                roomHasPassword = result.hasPassword;
                mp.roomPassword = result.hasPassword ? password : null;
                try {
                    const storageKey = `mp_host_password_${activeRoomId}`;
                    if (result.hasPassword) sessionStorage.setItem(storageKey, password);
                    else sessionStorage.removeItem(storageKey);
                } catch (e) {
                    // The server remains authoritative when browser storage is unavailable.
                }
                document.getElementById('roomPasswordStatus').textContent = roomHasPassword ? 'Password set. Invited participants will need it to open the link.' : 'Password removed. The link now opens the room directly.';
                document.getElementById('roomPasswordInput').value = result.hasPassword ? password : '';
            });
        }

        async function submitRoomPassword() {
            const password = document.getElementById('joinPasswordInput').value;
            const error = document.getElementById('passwordError');
            error.textContent = '';
            await joinGuest(password, document.getElementById('joinWithPasswordBtn'), error);
        }

        async function submitGuestJoin() {
            await joinGuest(null, document.getElementById('joinWithoutPasswordBtn'), document.getElementById('nameError'));
        }

        function handleNameEnter(event) {
            if (event.key !== 'Enter') return;
            if (guestPasswordRequired) document.getElementById('joinPasswordInput').focus();
            else submitGuestJoin();
        }

        async function joinGuest(password, submitButton, error) {
            const playerName = document.getElementById('joinNameInput').value.trim();
            error.textContent = '';
            if (!playerName) {
                error.textContent = 'Apna player name enter karein.';
                document.getElementById('joinNameInput').focus();
                return;
            }
            submitButton.disabled = true;
            try {
                joiningOptions = { ...joiningOptions, name: playerName };
                await mp.join(activeRoomId, { ...joiningOptions, password: password || null });
                const guestNameDisplay = document.getElementById('userNameInput');
                guestNameDisplay.value = playerName;
                guestNameDisplay.readOnly = true;
                guestNameDisplay.style.display = 'block';
                const prompt = document.getElementById('passwordPrompt');
                prompt.classList.add('hidden');
                prompt.style.display = 'none';
                const namePrompt = document.getElementById('guestNamePrompt');
                namePrompt.classList.add('hidden');
                namePrompt.style.display = 'none';
                document.getElementById('joinPasswordInput').value = '';
                await mp.initState({
                    poll: { question: "Which technology stack fits best?", options: ["#NodeJS & Express", "#SocketIO Realtime", "#Tailwind CSS", "#React / NextJS"], votes: { 0: 0, 1: 0, 2: 0, 3: 0 }, userVotes: {} }
                });
            } catch (err) {
                if (err.message === 'WRONG_PASSWORD') document.getElementById('passwordError').textContent = 'Password galat hai. Dobara try karein.';
                else error.textContent = 'Room join nahi ho paya. Dobara try karein.';
            } finally {
                submitButton.disabled = false;
            }
        }

        function showPasswordPrompt(requiresPassword) {
            guestPasswordRequired = requiresPassword;
            const namePrompt = document.getElementById('guestNamePrompt');
            namePrompt.classList.remove('hidden');
            namePrompt.style.display = 'block';
            document.getElementById('joinWithoutPasswordBtn').classList.toggle('hidden', requiresPassword);
            if (requiresPassword) {
                const prompt = document.getElementById('passwordPrompt');
                prompt.classList.remove('hidden');
                prompt.style.display = 'block';
            }
            document.getElementById('joinNameInput').focus();
        }

        function updateName() {
            const newName = document.getElementById('userNameInput').value;
            if (mp && newName) {
                const urlParams = new URLSearchParams(location.search);
                mp.join(urlParams.get('id'), { name: newName });
            }
        }

        // Tab band hone par user ko room se remove karo
        window.addEventListener('beforeunload', () => {
            if (mp) {
                mp.leave();
            }
        });
    </script>
</body>

</html>
